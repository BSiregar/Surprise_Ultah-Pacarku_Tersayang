<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Birthday Surprise</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
html,body{height:100%;background:#0a0720;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:Poppins,sans-serif;color:#fff}
canvas{position:fixed;inset:0;width:100%;height:100%}
.t{position:fixed;left:0;right:0;text-align:center;pointer-events:none;padding:0 7vw}
#t1{top:6vh;font-weight:600;font-size:clamp(20px,5vw,28px);transition:opacity .6s}
#h1{bottom:8vh;font-size:15px;opacity:.85;transition:opacity .6s;animation:pl 2s infinite}
body.go #t1,body.go #h1{opacity:0}
#hb{top:15vh;font:400 clamp(52px,17vw,100px)/1.05 'Great Vibes','Brush Script MT',cursive;color:#fff6dc;text-shadow:0 0 12px #f5d27a,0 0 34px rgba(245,210,122,.7)}
#hb span{display:inline-block;opacity:0}
body.go #hb span{animation:in 1s forwards}
#nm{top:34vh;font-size:clamp(16px,4.5vw,22px);letter-spacing:.08em;opacity:0}
#msg{bottom:11vh;font-size:clamp(13px,3.6vw,17px);line-height:1.6;opacity:0;max-width:560px;margin:0 auto}
#h2{bottom:4vh;font-size:13px;opacity:0}
body.go #nm{animation:fd 1.4s 4s forwards}
body.go #msg{animation:fd 1.4s 5.2s forwards}
body.go #h2{animation:fd 1.4s 8s forwards}
@keyframes in{from{opacity:0;filter:blur(10px);transform:translateY(14px)}to{opacity:1;filter:blur(0);transform:none}}
@keyframes fd{to{opacity:.95}}
@keyframes pl{50%{opacity:.35}}
#go{position:fixed;left:50%;bottom:4vh;transform:translateX(-50%);z-index:20;border:1px solid #f5d27a;background:rgba(92,24,72,.65);color:#fff6dc;font:600 15px Poppins,sans-serif;padding:13px 26px;border-radius:30px;box-shadow:0 0 22px rgba(245,210,122,.5);opacity:0;pointer-events:none;transition:opacity 1s;cursor:pointer;white-space:nowrap}
#go.show{opacity:1;pointer-events:auto;animation:pl 2.4s infinite}
/* ===== Galeri ===== */
#gal{position:fixed;inset:0;z-index:30;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;background:radial-gradient(ellipse at top,#4a1038 0%,#1a0516 70%);opacity:0;pointer-events:none;transition:opacity 1.2s}
#gal.open{opacity:1;pointer-events:auto}
#gal.lock{overflow:hidden}
#gal.lock header{display:none}
#sw{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:50;display:flex;gap:6px;background:rgba(0,0,0,.45);padding:5px;border-radius:30px;backdrop-filter:blur(8px)}
#sw button{border:0;background:none;color:#fff;font:600 12px Poppins,sans-serif;padding:7px 13px;border-radius:20px;opacity:.7;cursor:pointer}
#sw button.on{background:#ff5f9e;opacity:1}
#gal header{text-align:center;padding:76px 20px 26px}
#gal h1{font:400 clamp(48px,14vw,80px)/1 'Great Vibes','Brush Script MT',cursive;color:#fff6dc;text-shadow:0 0 12px #f5d27a,0 0 30px rgba(245,210,122,.6)}
.fh{position:fixed;bottom:-30px;color:#ff8fb8;opacity:.3;animation:up linear infinite;pointer-events:none;z-index:0}
@keyframes up{to{transform:translateY(-115vh) rotate(30deg)}}
#app{position:relative;z-index:1}
.ph{display:flex;align-items:center;justify-content:center;font-size:42px}
.end{text-align:center;padding:40px 24px 90px;font:400 clamp(28px,7vw,40px)/1.3 'Great Vibes',cursive;color:#fff6dc;max-width:640px;margin:0 auto}
.lb{position:fixed;inset:0;z-index:100;background:rgba(15,0,12,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center}
.lb img{max-width:92vw;max-height:76vh;border-radius:12px}
.lb .ph{width:80vw;max-width:420px;height:55vh;border-radius:12px}
.lb p{font:400 30px 'Great Vibes',cursive;color:#ffd6e5}
.lb small{display:block;font:12px Poppins,sans-serif;opacity:.7;letter-spacing:.1em}
.grid{display:flex;flex-wrap:wrap;gap:24px;justify-content:center;padding:0 14px}
.pol{width:clamp(150px,42vw,230px);background:#fff8f0;padding:10px 10px 4px;transform:rotate(var(--r));box-shadow:0 10px 28px rgba(0,0,0,.5);transition:.35s;cursor:pointer;position:relative}
.pol::before{content:"";position:absolute;top:-10px;left:50%;width:60px;height:20px;margin-left:-30px;background:rgba(255,200,220,.65);transform:rotate(-3deg)}
.pol:hover{transform:rotate(0) scale(1.06);z-index:2}
.pol img,.pol .ph{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.pol figcaption{font:400 24px 'Great Vibes',cursive;color:#7a2149;text-align:center;padding:6px 0}
.cine{position:fixed;inset:0;overflow:hidden}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1.2s}
.slide.on{opacity:1}
.slide img,.slide .ph{width:100%;height:100%;object-fit:cover;display:block;font-size:90px}
.slide.on img{animation:kb 6s ease-out forwards}
@keyframes kb{to{transform:scale(1.12)}}
.cap{position:absolute;left:0;right:0;bottom:0;padding:110px 24px 74px;background:linear-gradient(transparent,rgba(20,0,15,.88));font:400 clamp(34px,9vw,52px)/1.1 'Great Vibes',cursive;color:#fff6dc;text-align:center}
.cap small{display:block;font:12px Poppins,sans-serif;letter-spacing:.2em;opacity:.8;margin-bottom:6px}
.fin{display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;background:radial-gradient(#5c1848,#1a0516);font:400 clamp(30px,8vw,46px)/1.3 'Great Vibes',cursive;color:#fff6dc}
.nv{position:absolute;top:50%;z-index:5;border:0;background:rgba(0,0,0,.35);color:#fff;font-size:26px;width:44px;height:44px;border-radius:50%;cursor:pointer;margin-top:-22px}
.dots{position:absolute;bottom:26px;left:0;right:0;display:flex;gap:7px;justify-content:center;z-index:5}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35);transition:.3s}
.dots i.on{background:#ff5f9e;transform:scale(1.4)}
.tl{position:relative;max-width:820px;margin:0 auto;padding:10px 16px}
.tl::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:linear-gradient(#ff8fb8,transparent)}
.tc{width:50%;padding:0 28px 42px 0;opacity:0;transform:translateY(30px);transition:1s;position:relative}
.tc.r{margin-left:50%;padding:0 0 42px 28px}
.tc.in{opacity:1;transform:none}
.tc::after{content:"♥";position:absolute;right:-9px;top:20px;color:#ff8fb8;font-size:18px}
.tc.r::after{right:auto;left:-9px}
.card{background:rgba(255,255,255,.07);border:1px solid rgba(255,200,220,.2);border-radius:16px;overflow:hidden;cursor:pointer}
.card img,.card .ph{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}
.tx{padding:12px 14px}
.tx small{display:block;opacity:.7;font-size:12px;letter-spacing:.1em}
.tx b{font:400 27px 'Great Vibes',cursive;color:#ffd6e5}
@media(max-width:560px){.tl::before{left:14px}.tc,.tc.r{width:100%;margin:0;padding:0 0 34px 40px}.tc::after,.tc.r::after{left:6px;right:auto}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="t" id="t1">Birthday Surprise</div>
<div class="t" id="h1">Tarik busur, lalu lepaskan 🏹</div>
<h1 class="t" id="hb"></h1>
<div class="t" id="nm"></div>
<div class="t" id="msg"></div>
<div class="t" id="h2">Tap kuenya untuk meniup lilin 🕯️</div>

<button id="go">Lihat kenangan kita 💌</button>
<div id="gal"><div id="sw"></div><header><h1 id="ttl"></h1></header><div id="app"></div></div>

<script>
/* ====== UBAH DI SINI ====== */
const NAME = "Sayangku Cintaku Vanny Citra Sari Farasi";   // nama pacarmu
const MESSAGE = "Happy birthday My Baby Girl! Semoga semua doa, impian dan keinginanmu terwujudkan. Terima kasih sudah jadi alasan aku tersenyum setiap hari. I love you so much sayang 💖";
const MUSIC = "Lagu.mp3"; // nama file musik (harus ada di folder yang sama dengan file html)

/* ----- Galeri foto (muncul setelah lilin ditiup) ----- */
const TITLE = "Our Memories";
const END = "Terima kasih sudah jadi bagian terindah dalam hidupku. I love you 💖";
const DEFAULT_LAYOUT = 1;   // 0 = Polaroid, 1 = Cinematic, 2 = Timeline
const SWITCHER = false;     // true = ada tombol ganti desain (untuk mencoba). Setelah memilih, ubah ke false
const PHOTOS = [            // taruh foto di folder "foto" (sejajar dengan index.html), sesuaikan nama file
  {src:"4.jpg", cap:"Nonton bioskop",              date:"April 2025"},
  {src:"2.jpg", cap:"Ngedate karna Ultahku",         date:"Mei 2025"},
  {src:"3.jpg", cap:"Jalan-jalan berdua di Kaliurang",        date:"Juli 2025"},
  {src:"5.jpg", cap:"Nonton berdua bareng Kamu",            date:"April 2026"},
  {src:"1.jpg", cap:"Ngedate berdua di Bukit Bintang", date:"November 2026"},
  {src:"6.jpg", cap:"Selalu ada kamu",           date:"November 2026"}
];
/* ========================== */

const P=Math.PI, cl=(v,a,b)=>Math.max(a,Math.min(b,v)), rnd=(a,b)=>a+Math.random()*(b-a);
const PINK=['#ff8fb8','#ff5f9e','#ffc2d9','#f7a1c4','#ffd6e5'];
const BAL=['#e8c55a','#fff0f5','#c9b6f2','#ff9cc4'];
const $=s=>document.querySelector(s);
const cv=$('#c'), ctx=cv.getContext('2d');
let W,H,stars=[];
function rs(){
  const D=Math.min(devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;ctx.setTransform(D,0,0,D,0,0);
  stars=Array.from({length:70},()=>({x:rnd(0,W),y:rnd(0,H),r:rnd(.5,1.6),p:rnd(0,6)}));
}
addEventListener('resize',rs);rs();

$('#hb').innerHTML=[...'Happy Birthday'].map((ch,i)=>`<span style="animation-delay:${1.2+i*.12}s">${ch===' '?'&nbsp;':ch}</span>`).join('');
$('#nm').textContent='Untuk '+NAME+' 💖';
$('#msg').textContent=MESSAGE;

let st=1,T=0,s2=0,hs=[],bl=[],pt=[],lit=true,fl=0,spawn=0,balT=0;
let pull=0,drag=false,dsx=0,dsy=0,dt0=0,shot=null,burstT=0,alive=true,aud=null;
let hx,hy,hz,bx,by,a,cw,cy;

function heartPath(c,x,y,s){
  c.beginPath();c.moveTo(x,y+s*.9);
  c.bezierCurveTo(x-s*1.6,y-s*.1,x-s*.7,y-s*1.2,x,y-s*.4);
  c.bezierCurveTo(x+s*.7,y-s*1.2,x+s*1.6,y-s*.1,x,y+s*.9);
}
function geo(){
  hx=W/2;hy=H*.3;hz=Math.min(W,H)*.1;bx=W*.2;by=H*.74;
  a=Math.atan2(hy-by,hx-bx);cw=Math.min(W*.6,280);cy=H*.72;
}
function burst(x,y,n,rain){
  for(let i=0;i<n;i++){const an=rnd(0,P*2),sp=rnd(80,320);
    pt.push({x,y,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp-80,s:rnd(5,14),l:1,c:PINK[(Math.random()*5)|0],g:rain?420:200});}
}
function updParts(dt){
  ctx.save();ctx.shadowColor='#ff5f9e';ctx.shadowBlur=10;
  pt=pt.filter(p=>p.l>0);
  for(const p of pt){
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.l-=dt*.7;
    ctx.globalAlpha=Math.max(p.l,0);ctx.fillStyle=p.c;heartPath(ctx,p.x,p.y,p.s);ctx.fill();
  }
  ctx.restore();
}
function arrow(c,x,y){
  c.strokeStyle='#f3e6c8';c.lineWidth=3;c.beginPath();c.moveTo(x-36,y);c.lineTo(x+34,y);c.stroke();
  c.fillStyle='#ff8fb8';c.beginPath();c.moveTo(x+44,y);c.lineTo(x+30,y-7);c.lineTo(x+30,y+7);c.fill();
  c.strokeStyle='#ff8fb8';c.lineWidth=2;
  for(const k of[-1,1]){
    c.beginPath();c.moveTo(x-36,y);c.lineTo(x-46,y+k*7);c.stroke();
    c.beginPath();c.moveTo(x-28,y);c.lineTo(x-38,y+k*7);c.stroke();
  }
}

/* ---------- Scene 1: busur & hati ---------- */
function scene1(dt){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0a0720');g.addColorStop(1,'#1c0f3d');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff';
  for(const s of stars){ctx.globalAlpha=.4+.4*Math.sin(T*2+s.p);ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,P*2);ctx.fill();}
  ctx.globalAlpha=1;

  if(alive){
    const pulse=1+.06*Math.sin(T*5);
    ctx.save();ctx.shadowColor='#ff5f9e';ctx.shadowBlur=30;ctx.fillStyle='#ff8fb8';
    heartPath(ctx,hx,hy+Math.sin(T*2)*8,hz*pulse);ctx.fill();ctx.restore();
  }
  if(!drag&&!shot)pull+=(0-pull)*Math.min(1,dt*12);

  ctx.save();ctx.translate(bx,by);ctx.rotate(a);ctx.lineCap='round';
  ctx.strokeStyle='#d9c7a0';ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(-6,-60);ctx.quadraticCurveTo(34,0,-6,60);ctx.stroke();
  const pp=shot?0:pull;
  ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(-6,-60);ctx.lineTo(-6-pp,0);ctx.lineTo(-6,60);ctx.stroke();
  if(!shot&&alive)arrow(ctx,-6-pp+36,0);
  ctx.restore();

  if(shot){
    shot.t+=dt/.45;
    const e=Math.min(shot.t,1),e2=e*e,c=Math.cos(a),s=Math.sin(a);
    const sx=bx+c*(30-shot.pull),sy=by+s*(30-shot.pull),ex=hx-c*44,ey=hy-s*44;
    ctx.save();ctx.translate(sx+(ex-sx)*e2,sy+(ey-sy)*e2);ctx.rotate(a);arrow(ctx,0,0);ctx.restore();
    if(shot.t>=1){shot=null;alive=false;burstT=T;burst(hx,hy,60,false);}
  }
  if(burstT&&T-burstT>.8){st=2;s2=0;fl=1;document.body.classList.add('go');}
}

/* ---------- Scene 2: kue, hati, balon ---------- */
function bounce(x){const n=7.5625,d=2.75;
  if(x<1/d)return n*x*x;if(x<2/d)return n*(x-=1.5/d)*x+.75;
  if(x<2.5/d)return n*(x-=2.25/d)*x+.9375;return n*(x-=2.625/d)*x+.984375;}
function tier(x,y,w,h,c1,c2){
  const g=ctx.createLinearGradient(x-w/2,0,x+w/2,0);g.addColorStop(0,c1);g.addColorStop(.45,c2);g.addColorStop(1,c1);
  const ry=w*.09;ctx.fillStyle=g;ctx.fillRect(x-w/2,y-h,w,h);
  ctx.beginPath();ctx.ellipse(x,y,w/2,ry,0,0,P);ctx.fill();
  ctx.fillStyle='#ffd3e4';ctx.beginPath();ctx.ellipse(x,y-h,w/2,ry,0,0,P*2);ctx.fill();
  ctx.fillStyle='#fff';
  for(let i=0;i<=12;i++){const th=P*i/12;
    ctx.beginPath();ctx.arc(x+Math.cos(th)*w/2,y-h+Math.sin(th)*ry,w*.04,0,P*2);ctx.fill();}
}
function cake(x,y,w){
  ctx.save();
  const g=ctx.createLinearGradient(x-w*.65,0,x+w*.65,0);
  g.addColorStop(0,'#8a5a1c');g.addColorStop(.5,'#f5d27a');g.addColorStop(1,'#8a5a1c');
  ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(x,y+4,w*.66,w*.12,0,0,P*2);ctx.fill();
  tier(x,y,w,w*.34,'#e0649b','#ff9cc4');
  tier(x,y-w*.34,w*.66,w*.28,'#e0649b','#ff9cc4');
  const ty=y-w*.62;
  ctx.fillStyle='#ff5f9e';
  heartPath(ctx,x-w*.16,ty,w*.04);ctx.fill();heartPath(ctx,x+w*.16,ty,w*.04);ctx.fill();
  ctx.fillStyle='#fff';ctx.fillRect(x-3,ty-34,6,34);
  if(lit){
    const f=1+.15*Math.sin(T*18);
    ctx.shadowColor='#ffb347';ctx.shadowBlur=24;ctx.fillStyle='#ffd36b';
    ctx.beginPath();ctx.ellipse(x,ty-42,4,8*f,0,0,P*2);ctx.fill();
  }
  ctx.restore();
}
function balloon(b){
  const x=b.x+Math.sin(T+b.p)*14,ry=b.r*1.25;
  ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(x,b.y+ry);ctx.quadraticCurveTo(x+10*Math.sin(T*2+b.p),b.y+ry+35,x,b.y+ry+70);ctx.stroke();
  const g=ctx.createRadialGradient(x-b.r*.35,b.y-ry*.35,2,x,b.y,b.r*1.3);
  g.addColorStop(0,'#fff');g.addColorStop(.25,b.c);g.addColorStop(1,'rgba(0,0,0,.45)');
  ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(x,b.y,b.r,ry,0,0,P*2);ctx.fill();
  ctx.fillStyle=b.c;ctx.beginPath();ctx.moveTo(x,b.y+ry-2);ctx.lineTo(x-4,b.y+ry+6);ctx.lineTo(x+4,b.y+ry+6);ctx.fill();
}
function scene2(dt){
  s2+=dt;
  const g=ctx.createRadialGradient(W/2,H*.55,10,W/2,H*.55,H*.8);
  g.addColorStop(0,'#5c1848');g.addColorStop(1,'#1a0516');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  spawn-=dt;
  if(spawn<=0){spawn=.09;const dn=Math.random()<.25;
    hs.push({x:rnd(0,W),y:dn?-20:H+20,s:rnd(6,22),v:dn?rnd(40,90):-rnd(50,120),p:rnd(0,6),c:PINK[(Math.random()*5)|0],al:rnd(.45,.95)});}
  hs=hs.filter(h=>h.y>-40&&h.y<H+40);
  ctx.save();ctx.shadowColor='#ff5f9e';ctx.shadowBlur=12;
  for(const h of hs){h.y+=h.v*dt;h.x+=Math.sin(T*1.5+h.p)*20*dt;
    ctx.globalAlpha=h.al;ctx.fillStyle=h.c;heartPath(ctx,h.x,h.y,h.s);ctx.fill();}
  ctx.restore();

  const eb=bounce(cl(s2/1.8,0,1));
  cake(W/2,cy-(1-eb)*H*.9,cw);

  if(s2>3.2){balT-=dt;
    if(balT<=0&&bl.length<9){balT=1.1;bl.push({x:rnd(W*.08,W*.92),y:H+90,r:rnd(20,30),v:-rnd(45,80),p:rnd(0,6),c:BAL[(Math.random()*4)|0]});}}
  bl=bl.filter(b=>b.y>-120);
  for(const b of bl){b.y+=b.v*dt;balloon(b);}
}

function tap(x,y){
  if(lit&&Math.abs(x-W/2)<cw/2&&y>cy-cw*.95&&y<cy+10){
    lit=false;burst(W/2,cy-cw*.62-40,50,true);
    $('#h2').textContent='Semoga semua harapanmu terkabul ✨';
    setTimeout(()=>{$('#h2').style.display='none';$('#go').classList.add('show');},2800);
  }else burst(x,y,14,true);
}
addEventListener('pointerdown',e=>{
  if(MUSIC&&!aud){aud=new Audio(MUSIC);aud.loop=true;aud.play().catch(()=>{});}
  if(gal||e.target.closest('#go'))return;
  if(st===1&&!shot&&alive){drag=true;dsx=e.clientX;dsy=e.clientY;dt0=performance.now();}
  else if(st===2)tap(e.clientX,e.clientY);
});
addEventListener('pointermove',e=>{if(drag)pull=cl(Math.hypot(e.clientX-dsx,e.clientY-dsy)*.7,0,70);});
addEventListener('pointerup',()=>{
  if(!drag)return;drag=false;
  if(pull>20||performance.now()-dt0<250){if(pull<=20)pull=40;shot={t:0,pull};}
});

/* ---------- Galeri foto (setelah lilin ditiup) ---------- */
let gal=false,tm,cur=0;
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h)e.innerHTML=h;return e};
const app=$('#app');
$('#ttl').textContent=TITLE;

function pic(p,i){
  const im=new Image();im.src=p.src;im.alt=p.cap;im.loading='lazy';
  im.onerror=()=>{const d=el('div','ph','💖');
    d.style.background=`linear-gradient(135deg,hsl(${330+i*14},70%,45%),hsl(${300+i*20},60%,25%))`;im.replaceWith(d)};
  return im;
}
function openPic(i){
  const p=PHOTOS[i],lb=el('div','lb');
  lb.append(pic(p,i),el('p','',`<small>${p.date}</small>${p.cap}`));
  lb.onclick=()=>lb.remove();document.body.append(lb);
}
const endEl=()=>el('p','end',END);

function polaroid(){
  const g=el('div','grid');
  PHOTOS.forEach((p,i)=>{
    const c=el('figure','pol');c.style.setProperty('--r',((i%2?1:-1)*(1.5+(i%3)*1.2))+'deg');
    c.append(pic(p,i),el('figcaption','',p.cap));c.onclick=()=>openPic(i);g.append(c);
  });
  app.append(g,endEl());
}
function cinematic(){
  const w=el('div','cine'),dots=el('div','dots'),total=PHOTOS.length+1;
  PHOTOS.forEach((p,i)=>{
    const s=el('div','slide');s.append(pic(p,i),el('div','cap',`<small>${p.date}</small>${p.cap}`));
    w.append(s);dots.append(el('i'));
  });
  w.append(el('div','slide fin',`<p>${END}</p>`));dots.append(el('i'));
  const go=n=>{
    cur=(n+total)%total;
    w.querySelectorAll('.slide').forEach((s,i)=>s.classList.toggle('on',i===cur));
    dots.querySelectorAll('i').forEach((d,i)=>d.classList.toggle('on',i===cur));
  };
  const auto=()=>{clearInterval(tm);tm=setInterval(()=>go(cur+1),4500)};
  const mk=(t,side,d)=>{const b=el('button','nv',t);b.style[side]='10px';b.onclick=e=>{e.stopPropagation();go(cur+d);auto()};return b};
  w.append(dots,mk('‹','left',-1),mk('›','right',1));
  let x0=0;
  w.addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});
  w.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>50){go(cur+(dx<0?1:-1));auto()}});
  app.append(w);go(0);auto();
}
function timeline(){
  const t=el('div','tl');
  PHOTOS.forEach((p,i)=>{
    const c=el('div','tc '+(i%2?'r':'l')),card=el('div','card');
    card.append(pic(p,i),el('div','tx',`<small>${p.date}</small><b>${p.cap}</b>`));
    card.onclick=()=>openPic(i);c.append(card);t.append(c);
  });
  app.append(t,endEl());
  const io=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting&&e.target.classList.add('in')),{threshold:.15,root:$('#gal')});
  t.querySelectorAll('.tc').forEach(c=>io.observe(c));
}
const LAYOUTS=[['Polaroid',polaroid],['Cinematic',cinematic],['Timeline',timeline]];
function setLayout(n){
  clearInterval(tm);cur=0;app.innerHTML='';$('#gal').scrollTop=0;
  $('#gal').classList.toggle('lock',n===1);
  LAYOUTS[n][1]();
  document.querySelectorAll('#sw button').forEach((b,i)=>b.classList.toggle('on',i===n));
}
function openGallery(){
  gal=true;$('#go').classList.remove('show');
  setLayout(DEFAULT_LAYOUT);$('#gal').classList.add('open');
}
$('#go').onclick=openGallery;
if(SWITCHER)LAYOUTS.forEach((l,i)=>{const b=el('button','',l[0]);b.onclick=()=>setLayout(i);$('#sw').append(b)});
else $('#sw').remove();
for(let i=0;i<14;i++){
  const h=el('span','fh','♥');
  h.style.cssText=`left:${Math.random()*100}%;font-size:${10+Math.random()*18}px;animation-duration:${9+Math.random()*10}s;animation-delay:${-Math.random()*15}s`;
  $('#gal').append(h);
}

let last=performance.now();
function loop(n){
  const dt=Math.min((n-last)/1000,.05);last=n;if(gal){requestAnimationFrame(loop);return;}T+=dt;
  ctx.clearRect(0,0,W,H);geo();
  st===1?scene1(dt):scene2(dt);
  updParts(dt);
  if(fl>0){ctx.fillStyle='rgba(255,255,255,'+fl+')';ctx.fillRect(0,0,W,H);fl-=dt*1.5;}
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
